<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<div class="wrap">
  <h2>Shard health</h2>
  <div class="grid">
    <div class="tile"><b>12,480</b><span>queries</span></div>
    <div class="tile ok"><b>99.91%</b><span>success</span></div>
    <div class="tile"><b>121.7ms</b><span>best p99</span></div>
  </div>
  <button id="b">count interactions: <span id="n">0</span></button>
</div>
<script>
  let n = 0;
  document.getElementById('b').onclick = () => {
    document.getElementById('n').textContent = ++n;
  };
</script>
